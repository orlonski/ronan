# Login no app nativo, contra a api-falsa.mjs. Qualquer CPF/senha passa:
# quem valida é o servidor falso, e ele aceita tudo.
appId: br.com.schaba.motorista
---
- launchApp
- extendedWaitUntil:
    visible: "CPF"
    timeout: 30000
- tapOn: "000.000.000-00"
- inputText: "11122233344"
- tapOn:
    below: "SENHA"
- inputText: "senha-de-teste"
- hideKeyboard
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Adilson Ferreira"
    timeout: 30000
