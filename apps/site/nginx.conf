# Cuidado ao mexer: no nginx, um `add_header` dentro de um `location` DESCARTA
# todos os `add_header` herdados do `server`. Por isso os headers de segurança
# estão repetidos em cada location que define header próprio.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml+rss;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Página única: qualquer caminho serve o index
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O HTML nunca fica em cache, senão deploy novo não aparece
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
  }

  # Assets versionados pelo Vite (hash no nome) podem ficar cacheados pra sempre
  location ~* \.(?:js|css|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    access_log off;
  }

  location = /robots.txt {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400" always;
    access_log off;
  }

  location = /sitemap.xml {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400" always;
    access_log off;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
