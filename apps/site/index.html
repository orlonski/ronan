    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Movatruck",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Android, iOS, Web",
        "inLanguage": "pt-BR",
        "description": "Gestão de viagens para transportadoras de carga a granel: app offline para o motorista e painel web para conferência e fechamento.",
        "url": "https://www.movatruck.com.br/",
        "offers": { "@type": "Offer", "priceCurrency": "BRL", "category": "Assinatura mensal" }
      }
    </script>
    <script type="application/ld+json">
{
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Funciona sem internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Funciona. O motorista lança viagem, pedágio, abastecimento e foto direto no aparelho, sem rede nenhuma. O app guarda numa fila e envia sozinho quando o sinal volta — e a tela de Pendentes mostra o que ainda não subiu. Falha de rede nunca vira erro que trava o lançamento."
            }
          },
          {
            "@type": "Question",
            "name": "Precisa trocar de celular?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O app é nativo Android e iPhone e roda em aparelho comum. No iPhone também existe a versão web (PWA), que cobre lançar viagem, abastecimento, pedágio, OCR, pendentes e notificações — mas ela fica atrás do app nativo: stories, chat, viagem guiada, navegação por voz e diária existem só no nativo."
            }
          },
          {
            "@type": "Question",
            "name": "Meus dados ficam onde?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No Movatruck, dentro da conta da sua transportadora, isolada por trava automática no banco: dado de uma empresa não aparece pra outra. Você exporta viagens, abastecimentos e conferências em relatório a qualquer momento — o histórico é seu e sai de lá quando você quiser."
            }
          },
          {
            "@type": "Question",
            "name": "O motorista é obrigado a usar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O lançamento acontece no app, então na prática ele é o caminho. Mas o app foi feito pro lado dele: ele guarda o próprio histórico, os próprios documentos, os próprios gastos, e o km que ele informa fica registrado do jeito dele. Na transportadora onde já roda, a adesão veio porque o app resolve a vida dele, não porque alguém mandou."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto custa e como eu começo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É assinatura mensal por operação. O valor sai na conversa, depois de ver quantos motoristas e quantos clientes embarcadores você tem — não faz sentido chutar preço sem isso. O começo é uma demonstração de 30 minutos com o painel real na tela; se fizer sentido, a gente cadastra sua empresa, seus materiais e seus clientes e o primeiro motorista já lança no mesmo dia."
            }
          },
          {
            "@type": "Question",
            "name": "Dá pra usar em iPhone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dá. Tem app nativo pra iPhone e também a versão web, que abre no Safari sem passar pela loja. A versão web não tem tudo que o nativo tem — a lista completa da diferença a gente mostra na demonstração, sem enrolação."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso instalar servidor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O painel abre no navegador e o app vem das lojas. Você não instala nada, não contrata infraestrutura e não depende de TI interna pra subir o sistema."
            }
          },
          {
            "@type": "Question",
            "name": "E se o motorista errar o lançamento?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Erro se conserta. O painel corrige, mas o km faturado só muda com motivo escrito — sem motivo, o sistema recusa, e o que passa vira registro de auditoria com autor e data. Ticket que não bate com o lançado cai numa fila de conferência pra uma pessoa olhar, nunca vira desconto automático. E lançamento que o app não conseguiu enviar aparece inteiro no painel, pronto pra recuperar."
            }
          }
        ]
      }
    </script>
  </head>

    <div id="root"></div>

  </body>
